name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.11 matches the runtime image (Dockerfile: python:3.11-slim), so a
      # green run here means green on what actually ships.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No services needed: tests/conftest.py repoints DATABASE_URL at a
      # throwaway sqlite file before any app module is imported.
      - name: Run tests
        run: pytest tests -q

  # tests/test_ensemble_strategy.py importorskips freqtrade, so in the backend
  # job all 26 of its tests skip silently - including the R9 rule that stops
  # the bot entering on stale data. That rule is the reason no trades were
  # placed on the 120-hour-old klines, and nothing was guarding it.
  strategy:
    name: Strategy (freqtrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 matches the local .venv-freqtrade these tests are developed in.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-strategy.txt

      - name: Install freqtrade
        run: pip install -r requirements-strategy.txt

      # importorskip means a broken install would skip all 26 tests and still
      # exit 0, recreating the hole this job exists to close. Fail here first.
      - name: Verify freqtrade imports
        run: python -c "from freqtrade.strategy import IStrategy; print('ok')"

      - name: Run strategy tests
        run: pytest tests/test_ensemble_strategy.py -q -W ignore::DeprecationWarning

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # 22 matches frontend/Dockerfile (node:22-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # tsc and vitest both pass on a page that throws during prerender, and
      # nothing else covers page components. Without this the failure would
      # first appear as a broken `docker compose build` on the VPS.
      # Runs without frontend/.env.local: every env read has a fallback or is
      # request-time only.
      - name: Build
        run: npm run build
